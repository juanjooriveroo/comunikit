<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-5">

    <div class="card shadow-sm">
      <div class="card-body p-4">

        <h1 class="card-title text-center mb-4 h3">Editar Perfil</h1>
        <p class="text-center text-muted mb-4">Actualiza tu información personal</p>

        <div *ngIf="editSuccess" class="alert alert-success alert-dismissible fade show" role="alert">
          <div class="text-center">
            <h4 class="alert-heading mb-3">¡Perfil actualizado!</h4>
            <p class="mb-0">{{ successMessage }}</p>
            <p class="mt-3 text-muted small">Redirigiendo...</p>
          </div>
        </div>

        <div
          *ngIf="errorMessage"
          class="alert alert-danger"
          role="alert"
          aria-live="polite">
          <strong>Error:</strong> {{ errorMessage }}
        </div>

        <form
          [formGroup]="editForm"
          (ngSubmit)="onSubmit()"
          novalidate
          *ngIf="!editSuccess">

          <div class="mb-3">
            <label for="name" class="form-label">
              Nombre completo <span class="text-danger" aria-label="obligatorio">*</span>
            </label>
            <input
              type="text"
              id="name"
              class="form-control form-control-lg"
              [class.is-invalid]="submitted && f['name'].errors"
              formControlName="name"
              placeholder="Tu nombre completo"
              aria-required="true"
              aria-describedby="nameError"
              autocomplete="name">

            <div
              id="nameError"
              *ngIf="submitted && f['name'].errors"
              class="invalid-feedback"
              role="alert">
              <div *ngIf="f['name'].errors['required']">El nombre es obligatorio</div>
              <div *ngIf="f['name'].errors['minlength']">
                El nombre debe tener al menos 3 caracteres
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">
              Correo electrónico <span class="text-danger" aria-label="obligatorio">*</span>
            </label>
            <input
              type="email"
              id="email"
              class="form-control form-control-lg"
              [class.is-invalid]="submitted && f['email'].errors"
              formControlName="email"
              placeholder="tu@email.com"
              aria-required="true"
              aria-describedby="emailError"
              autocomplete="email">

            <div
              id="emailError"
              *ngIf="submitted && f['email'].errors"
              class="invalid-feedback"
              role="alert">
              <div *ngIf="f['email'].errors['required']">El email es obligatorio</div>
              <div *ngIf="f['email'].errors['email']">Introduce un email válido</div>
            </div>
          </div>

          <div class="mb-3">
            <label for="language" class="form-label">
              Idioma preferido <span class="text-danger" aria-label="obligatorio">*</span>
            </label>
            <select
              id="language"
              class="form-select form-select-lg"
              formControlName="language"
              aria-required="true">
              <option *ngFor="let lang of languages" [value]="lang.code">
                {{ lang.name }}
              </option>
            </select>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-lg w-100 mt-3"
            [disabled]="loading"
            [attr.aria-busy]="loading">
            <span *ngIf="!loading">Guardar Cambios</span>
            <span *ngIf="loading">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Guardando...
            </span>
          </button>

          <button
            type="button"
            class="btn btn-outline-secondary btn-lg w-100 mt-2"
            (click)="cancel()"
            [disabled]="loading">
            Cancelar
          </button>

        </form>

      </div>
    </div>

  </div>
</div>
