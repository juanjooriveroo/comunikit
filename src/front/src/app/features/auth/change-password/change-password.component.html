<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-5">

    <div class="card shadow-sm">
      <div class="card-body p-4">

        <h1 class="card-title text-center mb-4 h3">Cambiar Contraseña</h1>
        <p class="text-center text-muted mb-4">Actualiza tu contraseña de acceso</p>

        <div *ngIf="changeSuccess" class="alert alert-success alert-dismissible fade show" role="alert">
          <div class="text-center">
            <h4 class="alert-heading mb-3">¡Contraseña actualizada!</h4>
            <p class="mb-0">{{ successMessage }}</p>
            <p class="mt-3 text-muted small">Redirigiendo...</p>
          </div>
        </div>

        <div
          *ngIf="errorMessage"
          class="alert alert-danger"
          role="alert"
          aria-live="polite">
          <strong>Error:</strong> {{ errorMessage }}
        </div>

        <form
          [formGroup]="changePasswordForm"
          (ngSubmit)="onSubmit()"
          novalidate
          *ngIf="!changeSuccess">

          <div class="mb-3">
            <label for="oldPassword" class="form-label">
              Contraseña anterior <span class="text-danger" aria-label="obligatorio">*</span>
            </label>
            <input
              type="password"
              id="oldPassword"
              class="form-control form-control-lg"
              [class.is-invalid]="submitted && f['oldPassword'].errors"
              formControlName="oldPassword"
              placeholder="Tu contraseña anterior"
              aria-required="true"
              aria-describedby="oldPasswordError"
              autocomplete="current-password">

            <div
              id="oldPasswordError"
              *ngIf="submitted && f['oldPassword'].errors"
              class="invalid-feedback"
              role="alert">
              <div *ngIf="f['oldPassword'].errors['required']">La contraseña anterior es obligatoria</div>
            </div>
          </div>

          <div class="mb-3">
            <label for="newPassword" class="form-label">
              Nueva contraseña <span class="text-danger" aria-label="obligatorio">*</span>
            </label>
            <input
              type="password"
              id="newPassword"
              class="form-control form-control-lg"
              [class.is-invalid]="submitted && f['newPassword'].errors"
              formControlName="newPassword"
              placeholder="Tu nueva contraseña"
              aria-required="true"
              aria-describedby="newPasswordError"
              autocomplete="new-password">

            <div
              id="newPasswordError"
              *ngIf="submitted && f['newPassword'].errors"
              class="invalid-feedback"
              role="alert">
              <div *ngIf="f['newPassword'].errors['required']">La nueva contraseña es obligatoria</div>
              <div *ngIf="f['newPassword'].errors['minlength']">
                La contraseña debe tener al menos 8 caracteres
              </div>
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-lg w-100 mt-3"
            [disabled]="loading"
            [attr.aria-busy]="loading">
            <span *ngIf="!loading">Cambiar Contraseña</span>
            <span *ngIf="loading">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Cambiando...
            </span>
          </button>

          <button
            type="button"
            class="btn btn-outline-secondary btn-lg w-100 mt-2"
            (click)="cancel()"
            [disabled]="loading">
            Cancelar
          </button>

        </form>

      </div>
    </div>

  </div>
</div>
