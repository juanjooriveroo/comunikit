server:
  port: 0

spring:
  application:
    name: auth-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-group
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

app:
  jwt:
    secret: test-secret
    expiration: 3600

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
